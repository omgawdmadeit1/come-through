# Come Through → TestFlight via GitHub Actions (no local Mac required).
# Trigger from Windows: Actions → "iOS TestFlight" → Run workflow
# One-time secrets: APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "What testers will see for this build"
        required: false
        default: "Come Through TestFlight build"
      mark_latest:
        description: "Also push marketing version bump note"
        required: false
        default: "false"
  push:
    tags:
      - "ios-v*"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      CHANGELOG: ${{ github.event.inputs.changelog || 'Come Through TestFlight build' }}
      BUILD_NUMBER: ${{ github.run_number }}
      # Capacitor / Node
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require App Store Connect secrets
        run: |
          missing=0
          for v in APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add these once (from Windows browser) at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo ""
            echo "  APPLE_TEAM_ID          → 10-char Team ID (Membership details)"
            echo "  APPLE_API_KEY_ID       → App Store Connect API Key ID"
            echo "  APPLE_API_ISSUER_ID    → Issuer ID (UUID)"
            echo "  APPLE_API_KEY_P8       → full .p8 private key contents (including BEGIN/END lines)"
            echo ""
            echo "Create the API key: App Store Connect → Users and Access → Integrations → App Store Connect API"
            exit 1
          fi
          echo "Secrets present. Team=${APPLE_TEAM_ID} Key=${APPLE_API_KEY_ID}"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Sync Capacitor iOS (plugins + permissions)
        run: |
          npx cap sync ios
          node scripts/ios/apply-ios-permissions.mjs
          # re-apply icons / privacy after sync
          if [ -d ios-assets/AppIcon.appiconset ]; then
            rm -rf ios/App/App/Assets.xcassets/AppIcon.appiconset
            cp -R ios-assets/AppIcon.appiconset ios/App/App/Assets.xcassets/AppIcon.appiconset
          fi
          if [ -f ios-assets/PrivacyInfo.xcprivacy ]; then
            cp ios-assets/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          fi

      - name: Inject Apple Team ID into Xcode project
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          team = os.environ["APPLE_TEAM_ID"].strip()
          p = pathlib.Path("ios/App/App.xcodeproj/project.pbxproj")
          text = p.read_text()
          if "DEVELOPMENT_TEAM" in text:
              text = re.sub(r"DEVELOPMENT_TEAM = [^;]+;", f"DEVELOPMENT_TEAM = {team};", text)
          else:
              text = text.replace(
                  "CODE_SIGN_STYLE = Automatic;",
                  f"CODE_SIGN_STYLE = Automatic;\n\t\t\t\tDEVELOPMENT_TEAM = {team};",
              )
          p.write_text(text)
          print("DEVELOPMENT_TEAM set to", team)
          PY

      - name: Setup Ruby / Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: .

      - name: Install Fastlane gems
        run: |
          gem install bundler --no-document
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4

      - name: Write AuthKey.p8 for xcodebuild
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          # Support raw PEM or base64-encoded secret
          KEY_FILE="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_FILE"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_FILE"
          fi
          echo "AUTH_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"
          ls -la "$KEY_FILE"

      - name: Fastlane beta → TestFlight
        env:
          AUTH_KEY_PATH: ${{ env.AUTH_KEY_PATH }}
        run: bundle exec fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ComeThrough-ipa
          path: |
            build/*.ipa
            build/*.xcarchive
          if-no-files-found: ignore
          retention-days: 14
