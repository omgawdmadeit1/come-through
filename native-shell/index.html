<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Come Through</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0a0a0b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin: 0 auto 1.25rem;
        background: linear-gradient(145deg, #1a1a1e, #121214);
        border: 1px solid #2a2a30;
        display: grid;
        place-items: center;
        color: #7dd3c0;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0.75rem auto 0;
        max-width: 22rem;
        color: #a1a1aa;
        line-height: 1.5;
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        color: #0a0a0b;
        background: #7dd3c0;
        text-decoration: none;
        font-weight: 600;
        padding: 0.85rem 1.25rem;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="mark" aria-hidden="true">CT</div>
        <h1>Come Through</h1>
        <p>
          Opening your private cut-in rooms. If this screen stays up, check your
          connection and try again.
        </p>
        <a href="https://come-through.vercel.app/">Open Come Through</a>
      </div>
    </main>
  </body>
</html>
